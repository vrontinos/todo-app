name: Release Windows App

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
    paths:
      - package.json

permissions:
  contents: write

jobs:
  release-windows:
    # One main-branch release for v1.0.112; normal tag releases still work.
    if: github.ref_type == 'tag' || contains(github.event.head_commit.message, '[windows-v1.0.112]')
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Keep package-lock release version in sync
        if: github.ref_type != 'tag'
        shell: pwsh
        run: |
          $packageVersion = (Get-Content "package.json" -Raw | ConvertFrom-Json).version
          $lockJson = Get-Content "package-lock.json" -Raw | ConvertFrom-Json -AsHashtable
          $lockVersion = [string]$lockJson['version']
          $lockRootVersion = [string]$lockJson['packages']['']['version']

          if ($lockVersion -ne $packageVersion -or $lockRootVersion -ne $packageVersion) {
            if ($lockVersion -ne $lockRootVersion -or [string]::IsNullOrWhiteSpace($lockVersion)) {
              throw "Unsafe package-lock version state: top=$lockVersion root=$lockRootVersion package=$packageVersion"
            }

            $raw = Get-Content "package-lock.json" -Raw
            $pattern = '"version": "' + [regex]::Escape($lockVersion) + '"'
            $replacement = '"version": "' + $packageVersion + '"'
            $updated = [regex]::Replace($raw, $pattern, $replacement, 2)
            Set-Content "package-lock.json" -Value $updated -NoNewline -Encoding UTF8
          }

          $changes = git status --porcelain -- package-lock.json
          if ($changes) {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: sync package-lock for v$packageVersion"
            git push origin HEAD:main
          }

      - name: Production safety preflight
        run: node scripts/safety-preflight.cjs

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Build Tauri app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri:build

      - name: Create latest.json (NSIS)
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ("${{ github.ref_type }}" -ne "tag") { $tag = "v1.0.112" }
          $version = $tag.TrimStart("v")

          $bundleDir = "src-tauri/target/release/bundle/nsis"

          $originalExe = Get-ChildItem $bundleDir -Filter "*.exe" | Select-Object -First 1
          $originalSig = Get-ChildItem $bundleDir -Filter "*.exe.sig" | Select-Object -First 1

          if (-not $originalExe) { throw "NSIS EXE not found" }
          if (-not $originalSig) { throw "NSIS EXE signature not found" }

          # normalize filenames (no spaces)
          $safeExeName = $originalExe.Name.Replace(" ", ".")
          $safeSigName = $originalSig.Name.Replace(" ", ".")

          Rename-Item $originalExe.FullName $safeExeName
          Rename-Item $originalSig.FullName $safeSigName

          $exe = Get-ChildItem $bundleDir -Filter "*.exe" | Select-Object -First 1
          $sig = Get-ChildItem $bundleDir -Filter "*.exe.sig" | Select-Object -First 1

          $signature = (Get-Content $sig.FullName -Raw).Trim()
          $url = "https://github.com/${{ github.repository }}/releases/download/$tag/$($exe.Name)"

          $json = @{
            version = $version
            notes = "Release $version"
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = @{
              "windows-x86_64" = @{
                signature = $signature
                url = $url
              }
            }
          } | ConvertTo-Json -Depth 5

          $json | Set-Content "$bundleDir/latest.json" -Encoding UTF8

      - name: Publish Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.112' }}
          target_commitish: ${{ github.ref_type == 'tag' && github.sha || 'main' }}
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
            src-tauri/target/release/bundle/nsis/latest.json
