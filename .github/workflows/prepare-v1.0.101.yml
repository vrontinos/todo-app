name: Prepare v1.0.101 Metadata

on:
  push:
    branches:
      - release/v1.0.101
    paths:
      - .github/workflows/prepare-v1.0.101.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: release/v1.0.101
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
      - name: Update package and lockfile versions
        run: npm version 1.0.101 --no-git-tag-version
      - name: Update Tauri version
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs'
          const path = 'src-tauri/tauri.conf.json'
          const config = JSON.parse(fs.readFileSync(path, 'utf8'))
          if (config.version !== '1.0.100') throw new Error(`Unexpected Tauri version: ${config.version}`)
          config.version = '1.0.101'
          fs.writeFileSync(path, `${JSON.stringify(config, null, 2)}\n`)
          NODE
      - name: Verify production safety preflight
        run: node scripts/safety-preflight.cjs
      - name: Verify exact release metadata
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs'
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'))
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'))
          const tauri = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8'))
          if (pkg.version !== '1.0.101') throw new Error('package.json version mismatch')
          if (lock.version !== '1.0.101' || lock.packages?.['']?.version !== '1.0.101') throw new Error('package-lock.json version mismatch')
          if (tauri.version !== '1.0.101') throw new Error('Tauri version mismatch')
          NODE
      - name: Remove temporary helper and commit metadata
        run: |
          git rm .github/workflows/prepare-v1.0.101.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json src-tauri/tauri.conf.json
          git diff --cached --check
          git commit -m "Prepare v1.0.101 release metadata"
          git push origin HEAD:release/v1.0.101
